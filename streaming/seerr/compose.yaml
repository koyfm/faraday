services:
  seerr:
    image: ghcr.io/seerr-team/seerr
    container_name: seerr
    profiles:
      - seerr
      - streaming
    init: true
    environment:
      TZ: ${TZ:?}
      LOG_LEVEL: debug
    volumes:
      - type: bind
        source: ${APP_LOG_PATH:?}/seerr
        target: /app/config/logs
      - type: bind
        source: ${APP_DATA_PATH:?}/seerr
        target: /app/config
    # ports:
    #   - 5055:5055
    networks:
      - streaming
    labels:
      com.centurylinklabs.watchtower.enable: true
      docker-volume-backup.stop-during-backup: seerr
      traefik.enable: true
      traefik.http.routers.seerr.rule: Host(`seerr.${DOMAIN:?}`)
      traefik.http.routers.seerr.entryPoints: websecure
    depends_on:
      - jellyfin
      - radarr
      - sonarr
    restart: unless-stopped

  seerr-backup:
    image: offen/docker-volume-backup:v2
    container_name: seerr-backup
    profiles:
      - backup
      - seerr
      - streaming
    environment:
      EXEC_LABEL: seerr
      BACKUP_STOP_DURING_BACKUP_LABEL: seerr
      BACKUP_PRUNING_PREFIX: backup-
      BACKUP_RETENTION_DAYS: 7
    volumes:
      - type: bind
        source: ${APP_DATA_PATH:?}/seerr
        target: /backup/seerr
        read_only: true
      - type: bind
        source: ${BACKUP_DATA_PATH:?}/seerr
        target: /archive
      - type: bind
        source: /var/run/docker.sock
        target: /var/run/docker.sock
        read_only: true
    network_mode: none
    labels:
      com.centurylinklabs.watchtower.enable: true
    restart: unless-stopped
